# Each push to master: the checks, and the release build, so a tag pushed
# onto a commit that passed builds too. The steps are in ci/, to run anywhere.
name: CI

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit and tag: the version is git's description of the commit.
          fetch-depth: 0
          # The token only where it's given: not on disk, for every build script
          # and test to read.
          persist-credentials: false
      - run: ci/setup.sh
      - run: ci/lint.sh
      - run: ci/test.sh
      - run: ci/dist.sh
