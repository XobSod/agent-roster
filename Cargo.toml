[package]
name = "agent-roster"
version = "0.1.0"
edition = "2024"
description = "Keyboard-first terminal manager for AI coding agent sessions"

[[bin]]
name = "roster"
path = "src/main.rs"

# The note editor's, vendored and patched (vendor/edtui/ROSTER.md): a member
# so its own tests run (cargo test -p edtui); commands here build roster.
[workspace]
members = ["vendor/edtui"]

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
edtui = { path = "vendor/edtui", default-features = false }
libc = "0.2.191"
memchr = "2.8.3"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
toml = "1.1.8"
toml_edit = "0.25.13"
unicode-segmentation = "1.13.3"
unicode-width = "0.2"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

# Dependencies optimized in debug builds too: unoptimized, parsing a long Claude
# transcript (tens of MB) takes several times longer. Roster's own code stays
# quick to rebuild.
[profile.dev.package."*"]
opt-level = 3

# edtui too: vendored, it's a workspace member, which "*" leaves out.
[profile.dev.package.edtui]
opt-level = 3
