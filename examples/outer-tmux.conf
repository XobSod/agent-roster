# For your own tmux config (~/.tmux.conf), if you run roster inside tmux.
#
# Two prefixes: yours (<prefix> below), and roster's, C-a, set in
# ~/.config/agent-roster/tmux.conf (examples/tmux.conf; any key works, C-a is
# just the example's choice). If yours differs (C-b, say), you need nothing
# here: C-a [ in a roster pane already reaches roster's tmux.
# If they're the same key, either press it twice (C-a C-a [), or add this, so
# your usual <prefix> [ (and <prefix> Enter) send roster's C-a [ in a pane
# running roster, opening copy mode on the agent's full history, and stay normal
# copy mode everywhere else. It works with any prefix of yours; if roster's
# isn't C-a, change the send-keys below to match.
# (In roster's list view this sends C-a [ to the TUI, which ignores it.)
bind [     if -F '#{m:*roster,#{pane_current_command}}' { send-keys C-a [ }     { copy-mode }
bind Enter if -F '#{m:*roster,#{pane_current_command}}' { send-keys C-a Enter } { copy-mode }

# Copying with y in roster's copy mode reaches your clipboard through the
# terminal (OSC 52) only if your tmux passes it on:
# set -s set-clipboard on
