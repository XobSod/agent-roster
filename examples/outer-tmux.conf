# For your own tmux config, if you run roster inside tmux and use the same
# prefix (C-a) in roster's tmux.conf (examples/tmux.conf).
# In a pane running roster, C-a [ is passed on to roster's tmux, so copy mode
# opens on the agent's full history. Everywhere else it is normal copy mode.
# (In roster's list view this sends C-a [ to the TUI, which ignores it.)
bind [ if -F '#{m:*roster,#{pane_current_command}}' { send-keys C-a [ } { copy-mode }
