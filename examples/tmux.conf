# Optional additions to roster's private tmux server.
# Copy to ~/.config/agent-roster/tmux.conf. Without this file, every key except
# the back key (Ctrl+Q) goes straight to the agent.
#
# Scrolling back through an agent's history: a screen-style prefix and copy mode.
#   C-a [     copy mode with vi keys (k/j, C-u/C-d, / to search, q to leave)
#   C-a C-a   a literal C-a for the agent
# Running roster inside your own tmux with the same prefix? Press C-a C-a [,
# or add examples/outer-tmux.conf to your tmux config so C-a [ just works.
set -g prefix C-a
bind [ copy-mode
bind C-a send-prefix
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Copying with y reaches the system clipboard through the terminal (OSC 52).
# Inside your own tmux, that tmux must pass it on: set -s set-clipboard on
# Or pipe the selection straight to a clipboard tool instead:
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'clip.exe'   # WSL
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'    # Wayland
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'     # macOS
