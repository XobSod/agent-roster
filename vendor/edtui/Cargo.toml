[package]
name = "edtui"
version = "0.11.7"
edition = "2021"
repository = "https://github.com/preiter93/edtui"
keywords = ["ratatui", "tui", "editor", "text", "vim"]
description = "A TUI based vim inspired editor"
authors = ["preiter <phil.reiter93@gmail.com>"]
license = "MIT"

[dependencies]
ratatui-core = { package = "ratatui-core", version = "0.1" }
ratatui-widgets = { version = "0.3.0", default-features = false }
crossterm = { package = "crossterm", version = "0.29" }

jagged = { package = "edtui-jagged", version = "0.1" }
enum_dispatch = "0.3"
unicode-width = "0.2.0"

[dev-dependencies]
ratatui = { package = "ratatui", version = "0.30" }

[features]
default = ["mouse-support"]
mouse-support = []

# Roster's copy is without the features roster doesn't use, and their
# dependencies (ROSTER.md); the code for them is as edtui has it, never built.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("arboard", "arbitrary", "syntax-highlighting", "system-editor"))',
] }
